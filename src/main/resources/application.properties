spring.application.name=clinica-api

# Banco H2 salvo em arquivo (pasta ./data) - os dados continuam depois de reiniciar
spring.datasource.url=jdbc:h2:file:./data/clinica
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Console do H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/clinica)
spring.h2.console.enabled=true
